name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'arm64 (Dopamine 3.0.9 rootless) or arm64e (future)'
        required: false
        default: 'arm64'
      skip_macos_jobs:
        description: 'Skip macOS-14 jobs (offline billing-friendly mode)'
        type: boolean
        required: false
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_check:
    name: offline static checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Python deps
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pyyaml
      - name: Run offline check
        run: |
          set -e
          python3 scripts/ci_offline_check.py

  verify:
    name: build / verify (${{ matrix.arch }})
    # macos-14 is paid (10x Linux minutes). Allow workflows to skip it via
    # `workflow_dispatch` input or repo-level variable
    # `UH_CI_SKIP_MACOS=1`. The job is also marked `continue-on-error: true`
    # so a billing skip does not turn the whole CI red.
    runs-on: macos-14
    timeout-minutes: 60
    continue-on-error: true
    needs: offline_check
    if: |
      (github.event_name == 'workflow_dispatch' && !inputs.skip_macos_jobs)
      || (github.event_name != 'workflow_dispatch'
          && vars.UH_CI_SKIP_MACOS != '1')
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]

    env:
      THEOS: /opt/theos
      THEOS_DEVICE_IP: 127.0.0.1
      THEOS_DEVICE_PORT: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Prepare paths
        run: |
          echo "THEOS=/opt/theos"  >> $GITHUB_ENV
          echo "/opt/theos/bin"     >> $GITHUB_PATH
          echo "/opt/homebrew/bin"   >> $GITHUB_PATH

      - name: Show tool versions
        run: |
          sw_vers
          clang --version || true
          xcode-select -p

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: theos-$(date +%Y%V)-v3
          restore-keys: |
            theos-

      - name: Install Theos (cache miss)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt
          sudo chown -R $(whoami) /opt
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos

      - name: Ensure Theos submodules
        run: |
          if [ -d "/opt/theos" ]; then
            git -C /opt/theos submodule update --init --recursive --depth 1 || true
          fi

      - name: Install build tools
        run: |
          brew install dpkg ldid jq xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "make version:"
          make --version | head -n1
          echo "dpkg-deb version:"
          dpkg-deb --version | head -n1
          echo "ldid path:"
          which ldid || true

      - name: Cache iOS 18.6 SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /opt/theos/sdks/iPhoneOS18.6.sdk
          key: ios-sdk-18.6-archive-$(date +%Y%V)-v2
          restore-keys: |
            ios-sdk-18.6-archive-

      - name: Download iOS SDK (cache miss)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp
          # Fall-back URL list — try community SDK mirrors that publish
          # pre-patched iOS 18.6 SDK bundles ready for Theos.
          URLS=(
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.6-SDKs/iPhoneOS18.6.sdk.zip"
            "https://github.com/Tonwalter888/iOS-SDKs/archive/refs/heads/main.zip"
          )
          for u in "${URLS[@]}"; do
            echo "[sdk] trying $u"
            if curl --fail -sSL -o ios18.6.sdk.zip "$u"; then
              ls -lh ios18.6.sdk.zip
              break
            fi
          done
          test -s ios18.6.sdk.zip
          mkdir -p /opt/theos/sdks
          unzip -q -o ios18.6.sdk.zip -d /opt/theos/sdks/
          # xybp888 archive has root iPhoneOS18.6.sdk/, Tonwalter888 needs
          # different layout; pick whichever materialised.
          if [[ ! -d /opt/theos/sdks/iPhoneOS18.6.sdk ]]; then
            # Some archives nest the SDK in a subdirectory; promote it.
            SUBDIR=$(find /opt/theos/sdks -type d -name iPhoneOS18.6.sdk | head -n1)
            if [[ -n "$SUBDIR" && "$SUBDIR" != "/opt/theos/sdks/iPhoneOS18.6.sdk" ]]; then
              echo "[sdk] promoting $SUBDIR"
              mv "$SUBDIR" /opt/theos/sdks/iPhoneOS18.6.sdk
            fi
          fi
          rm ios18.6.sdk.zip
          ls /opt/theos/sdks/

      - name: Validate sources
        run: |
          set -e
          python3 -c "import json; print('vectors.json OK ->', len(json.load(open('Resources/vectors.json'))['vectors']), 'vectors')"
          python3 -c "import plistlib; plistlib.load(open('Resources/config.plist', 'rb')); print('config.plist OK')"
          python3 -c "import plistlib; plistlib.load(open('Resources/entitlements.plist', 'rb')); print('entitlements.plist OK')"
          python3 -c "import plistlib; plistlib.load(open('entry.plist', 'rb')); print('entry.plist OK')"

      - name: Build
        run: |
          set -e
          # Ensure Theos / GNU make are on PATH inside this shell.
          # `internal-package-check` runs `dm.pl` via __executable(), which
          # looks it up in $PATH. /opt/theos/bin must be on PATH here.
          export PATH="/opt/theos/bin:/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          export THEOS=/opt/theos
          bash scripts/test_app.sh

      - name: Smoke inspect
        run: |
          set -e
          DEB=$(ls -t packages/*.deb | head -n1)
          echo "[ci] built $DEB size=$(stat -f%z $DEB)"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -n 60

      - name: Fail-soft post checks
        if: always()
        run: |
          set -e
          echo "=== Tail of dmesg-style messages ===" || true
          if compgen -G "build/*.log" > /dev/null; then
            tail -n 80 build/*.log
          fi

      - name: Upload .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UltraHidePro-${{ matrix.arch }}-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UltraHidePro-${{ matrix.arch }}-log
          path: |
            build/
            packages/
            .theos/
          if-no-files-found: warn
          retention-days: 3

  lint:
    name: clang static analysis
    runs-on: macos-14
    timeout-minutes: 20
    continue-on-error: true
    needs: [offline_check, verify]
    if: |
      (github.event_name == 'workflow_dispatch' && !inputs.skip_macos_jobs)
      || (github.event_name != 'workflow_dispatch'
          && vars.UH_CI_SKIP_MACOS != '1')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Theos
        run: |
          if [[ ! -d /opt/theos ]]; then
            sudo mkdir -p /opt
            sudo chown -R $(whoami) /opt
            git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          fi
      - name: Cache SDK
        id: cache-sdk-lint
        uses: actions/cache@v4
        with:
          path: /opt/theos/sdks/iPhoneOS18.6.sdk
          key: ios-sdk-18.6-archive-$(date +%Y%V)-v2
          restore-keys: |
            ios-sdk-18.6-archive-
      - name: Download iOS SDK (cache miss)
        if: steps.cache-sdk-lint.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp
          URLS=(
            "https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.6-SDKs/iPhoneOS18.6.sdk.zip"
            "https://github.com/Tonwalter888/iOS-SDKs/archive/refs/heads/main.zip"
          )
          for u in "${URLS[@]}"; do
            if curl --fail -sSL -o ios18.6.sdk.zip "$u"; then
              break
            fi
          done
          test -s ios18.6.sdk.zip
          mkdir -p /opt/theos/sdks
          unzip -q -o ios18.6.sdk.zip -d /opt/theos/sdks/
          if [[ ! -d /opt/theos/sdks/iPhoneOS18.6.sdk ]]; then
            SUBDIR=$(find /opt/theos/sdks -type d -name iPhoneOS18.6.sdk | head -n1)
            if [[ -n "$SUBDIR" && "$SUBDIR" != "/opt/theos/sdks/iPhoneOS18.6.sdk" ]]; then
              mv "$SUBDIR" /opt/theos/sdks/iPhoneOS18.6.sdk
            fi
          fi
          rm -f ios18.6.sdk.zip
      - name: Static analysis
        run: |
          set +e
          mkdir -p build
          THEOS=/opt/theos PATH=/opt/theos/bin:$PATH make analyze=1 2>&1 | tee build/analyze.log
          rc=${PIPESTATUS[0]}
          echo "analyze exit=$rc"
          # intentionally non-fatal so PRs don't get blocked by static
          # analysis noise; treat exit non-zero as warning.
          exit 0
